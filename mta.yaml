_schema-version: "3.1"
ID: labsupplies
description: A simple CAP project.
version: 1.0.0
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
  - builder: custom
    commands:
      - npm ci
      - npx cds build --production
modules:
- name: labsupplies-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: labsupplies-db
  - name: labsupplies-auth
  - name: labsupplies-destination
  - name: labsupplies-jobscheduler
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: npm
- name: labsupplies-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: labsupplies-db
  parameters:
    buildpack: nodejs_buildpack
- name: labsupplies-destination-content
  type: com.sap.application.content
  requires:
  - name: labsupplies-destination
    parameters:
      content-target: true
  - name: labsupplies-html-repo-host
    parameters:
      service-key:
        name: labsupplies-html-repo-host-key
  - name: labsupplies-auth
    parameters:
      service-key:
        name: labsupplies-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: labsupplies-html-repo-host
          ServiceInstanceName: labsupplies-html5-app-host-service
          ServiceKeyName: labsupplies-html-repo-host-key
          sap.cloud.service: laborders
        - Authentication: OAuth2UserTokenExchange
          Name: labsupplies-auth
          ServiceInstanceName: labsupplies-auth
          ServiceKeyName: labsupplies-auth-key
          sap.cloud.service: laborders
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: labsupplies-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: labsupplies-html-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - orders.zip
      name: orders
      target-path: resources/
- name: orders
  type: html5
  path: app/orders
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build:cf
    supported-platforms: []
resources:
- name: labsupplies-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: labsupplies-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: labsupplies-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: labsupplies-destination
    service-plan: lite
  requires:
  - name: srv-api
- name: labsupplies-html-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: labsupplies-html5-app-host-service
    service-plan: app-host
- name: labsupplies-auth
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: labsupplies-auth
    service-plan: application
- name: labsupplies-jobscheduler
  type: org.cloudfoundry.managed-service
  parameters:
    service: jobscheduler
    service-plan: lite
    service-name: labsupplies-jobscheduler
    config:
      enable-xsuaa-support: true
